name: Paper Lab
on:
  workflow_dispatch:
  schedule:
    - cron: '9,24,39,54 * * * *'
permissions:
  contents: write
concurrency:
  group: paper-lab
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -v
      - name: Simulation
        run: python run.py
      - name: Persist portfolio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/portfolio.json state/report.json state/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update Paper Lab [skip ci]'
            git push
          fi
